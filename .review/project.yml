schema_version: "1.0"
project:
  id: journey-connect-backend
  name: Journey Connect Backend
  type: backend-platform
  repository_root: "."
  baseline_branch: main
inherits: [spring-postgres]
technology:
  languages: [java, kotlin, sql]
  frameworks: [spring-boot]
  database:
    engine: postgresql
    migration_tool: flyway
  build:
    tool: gradle
scope:
  include:
    - "jc-backend/**"
    - "jc-data-contracts/**"
    - "jc-intelligence-contracts/**"
    - "jc-recommendation-core/**"
    - "jc-search-compatibility/**"
    - "jc-search-contracts/**"
    - "jc-search-integration/**"
    - "jc-search-production-controls/**"
    - "jc-search-readiness/**"
    - "jc-search-runtime/**"
    - "jc-search-shadow-wiring/**"
    - "database/**"
    - "verification/**"
    - "tools/**"
    - "docs/**"
    - "*.md"
    - ".review/**"
    - ".github/workflows/**"
  exclude:
    - "jc-frontend/**"
    - "**/build/**"
    - "**/generated/**"
    - ".gradle/**"
    - ".pie/**"
protected_paths:
  - "database/journey-connect-db-v2.7/0[1-9]_*"
  - "database/journey-connect-db-v2.7/1[0-9]_*"
  - "database/journey-connect-db-v2.7/2[0-9]_*"
  - "database/journey-connect-db-v2.7/3[0-4]_*"
commands:
  build: []
  baseline: []
  integration: []
  lint: []
review:
  packs:
    - universal.architecture
    - universal.requirements-traceability
    - universal.test-completeness
    - application.authentication
    - application.authorization
    - data.relational-integrity
    - data.migration-safety
    - data.transactionality
    - runtime.retries-idempotency
    - domain.recommendation
    - domain.search
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: false
    regression_tests: false
    confirmed_findings_resolved: false
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false
