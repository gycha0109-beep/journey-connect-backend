name: ADM-2 Source Intake

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm2-source-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Package source
        run: tar --exclude=.git -czf /tmp/adm2-source.tgz .
      - uses: actions/upload-artifact@v6
        with:
          name: adm2-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/adm2-source.tgz
          if-no-files-found: error
