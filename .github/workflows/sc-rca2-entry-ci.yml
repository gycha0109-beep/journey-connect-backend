name: SC-5 RCA-2 Entry Governance CI

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/platform/governance/**"
      - "verification/sc-next-track/rca2-entry/**"
      - ".github/workflows/sc-rca2-entry-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc-rca2-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: RCA-2 entry authorization verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore full history if required
        run: |
          if [ -f .git/shallow ]; then
            git fetch --unshallow origin
          else
            git fetch origin main
          fi
      - name: Run independent SC-5 verifier
        run: |
          set -o pipefail
          python verification/sc-next-track/rca2-entry/run_sc_rca2_entry_verification.py \
            2>&1 | tee verification/sc-next-track/rca2-entry/runtime/SC_RCA2_ENTRY_VERIFIER.log
      - name: Upload exact-head governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-rca2-entry-governance-evidence
          retention-days: 90
          path: |
            verification/sc-next-track/rca2-entry/runtime/**
          if-no-files-found: error
