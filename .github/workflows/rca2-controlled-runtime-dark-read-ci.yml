name: RCA-2 Controlled Runtime Dark Read CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'jc-backend/src/main/java/com/jc/backend/recommendation/rca2/**'
      - 'jc-backend/src/test/java/com/jc/backend/recommendation/rca2/**'
      - 'jc-backend/src/main/resources/application-rca2-isolated-nonproduction.yml'
      - 'jc-backend/src/main/java/com/jc/backend/recommendation/application/RecommendationFeedService.java'
      - 'jc-backend/build.gradle.kts'
      - 'verification/rca2/**'
      - 'docs/platform/recommendation/rca2/**'
      - '.github/actions/rca2-job/**'
      - '.github/workflows/rca2-controlled-runtime-dark-read-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rca2-controlled-runtime-dark-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline_sc5_merge_verification:
    name: Baseline / SC-5 merge verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: baseline
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  compile_and_unit_tests:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: compile-unit
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  feature_flag_fail_closed_tests:
    name: Feature flag fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: feature-flag
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  traffic_zero_tests:
    name: Traffic 0 tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: traffic-zero
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  primary_shadow_authority_tests:
    name: Primary / shadow authority tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: authority
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  async_post_response_boundary_tests:
    name: Async post-response boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: async-boundary
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  executor_saturation_tests:
    name: Executor saturation tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: executor
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  timeout_cancellation_tests:
    name: Timeout / cancellation tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: timeout
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  circuit_breaker_tests:
    name: Circuit breaker tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: breaker
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  kill_switch_tests:
    name: Kill-switch tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: kill-switch
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  identity_allowlist_tests:
    name: Identity allowlist tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: identity
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  p1_runtime_lane_tests:
    name: P1 runtime lane tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: p1-lane
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  p2_runtime_lane_tests:
    name: P2 runtime lane tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: p2-lane
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  checkpoint_lineage_measurement_tests:
    name: Checkpoint / lineage measurement tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: checkpoint-lineage
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  response_mutation_verifier:
    name: Response mutation verifier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: response-mutation
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  no_write_no_event_verifier:
    name: No-write / no-event verifier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: no-write-event
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  metrics_cardinality_redaction_verifier:
    name: Metrics cardinality / redaction verifier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: metrics-redaction
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  rollback_simulation:
    name: Rollback simulation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: rollback
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  protected_regression:
    name: Protected regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: protected-regression
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  exact_head_verifier:
    name: Exact-head verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute RCA-2 gate
        uses: ./.github/actions/rca2-job
        with:
          lane: exact-head
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}

  artifact_upload:
    name: Artifact upload
    needs: [baseline_sc5_merge_verification, compile_and_unit_tests, feature_flag_fail_closed_tests, traffic_zero_tests, primary_shadow_authority_tests, async_post_response_boundary_tests, executor_saturation_tests, timeout_cancellation_tests, circuit_breaker_tests, kill_switch_tests, identity_allowlist_tests, p1_runtime_lane_tests, p2_runtime_lane_tests, checkpoint_lineage_measurement_tests, response_mutation_verifier, no_write_no_event_verifier, metrics_cardinality_redaction_verifier, rollback_simulation, protected_regression, exact_head_verifier]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Recreate exact-head evidence
        uses: ./.github/actions/rca2-job
        with:
          lane: artifact
          expected-head: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload RCA-2 redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rca2-controlled-runtime-dark-read-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            verification/rca2/**
            docs/platform/recommendation/rca2/**
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
