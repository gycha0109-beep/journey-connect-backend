name: ADM-4 Admin Dashboard UI

on:
  pull_request:
    branches: [main]
    paths:
      - "jc-frontend/**"
      - "docs/admin/ADM-4-ADMIN-DASHBOARD-UI-FINALISATION.md"
      - ".github/workflows/adm4-admin-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adm4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: jc-frontend
        run: npm install --no-audit --no-fund
      - name: Run ADM-4 frontend tests
        working-directory: jc-frontend
        run: npm test
      - name: Run lint
        working-directory: jc-frontend
        run: npm run lint
      - name: Build frontend
        working-directory: jc-frontend
        run: npm run build
      - name: Run ADM-4 verifier
        working-directory: jc-frontend
        run: npm run verify:adm4
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: adm4-frontend-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: jc-frontend/verification/adm4/adm4-evidence.json
          if-no-files-found: error

  backend-integration-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify exact backend endpoint and DTO contract
        run: node jc-frontend/verification/adm4/verify-backend-contract.mjs .
      - name: Run inherited Admin PostgreSQL integration tests
        id: admin_postgres_tests
        continue-on-error: true
        working-directory: jc-backend
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          mkdir -p ../jc-frontend/verification/adm4/evidence
          ./gradlew :test \
            --tests com.jc.backend.admin.AdminHardeningIntegrationTest \
            --tests com.jc.backend.admin.AdminBasicApisIntegrationTest \
            --tests com.jc.backend.admin.security.AdminSecurityIntegrationTest \
            --tests com.jc.backend.database.DatabaseRoleRoutingIntegrationTest \
            --console=plain --no-daemon 2>&1 \
            | tee ../jc-frontend/verification/adm4/evidence/admin-postgres-tests.log
      - name: Upload inherited Admin PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adm4-backend-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            jc-frontend/verification/adm4/evidence/admin-postgres-tests.log
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
          if-no-files-found: error
      - name: Enforce inherited Admin PostgreSQL result
        if: steps.admin_postgres_tests.outcome == 'failure'
        run: exit 1
