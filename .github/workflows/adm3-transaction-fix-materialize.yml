name: ADM-3 Transaction Fix Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm3-transaction-fix-materialize.yml"
      - "verification/admin/adm3/fix/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/adm3-admin-api-hardening-audit-acceptance' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply transaction fix
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode verification/admin/adm3/fix/transaction-command-adapters.patch.gz.b64 \
            | gzip --decompress > /tmp/adm3-fix.patch
          echo "ddc133ebbd4ddd3a542f2dfd6c0cba6628931293bcf3736a4d87906503b7d543  /tmp/adm3-fix.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/adm3-fix.patch
          git apply --index /tmp/adm3-fix.patch
          git rm -r verification/admin/adm3/fix
          git diff --cached --check
      - name: Commit and push transaction fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admin): preserve idempotency across database races"
          git push origin HEAD:agent/adm3-admin-api-hardening-audit-acceptance
