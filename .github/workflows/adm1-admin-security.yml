name: ADM-1 Admin Security Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "jc-backend/src/main/**"
      - "jc-backend/src/test/**"
      - "jc-backend/build.gradle.kts"
      - "database/journey-connect-db-v2.7/README*.md"
      - "docs/admin/adm1/**"
      - "verification/admin/adm1/**"
      - ".github/workflows/adm1-admin-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adm1-admin-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ADM1_BASE_SHA: ${{ github.event.pull_request.base.sha || 'a2b9e3d8e79df3dcf9d75b418011b3a8cca754b1' }}
  ADM1_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract_and_scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify contracts, source, tests and scope
        run: python verification/admin/adm1/verify_adm1.py --check all

  admin_postgres_security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: jc-backend
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper execution
        run: chmod +x ./gradlew
      - name: Run Admin security and database role tests
        id: admin_tests
        continue-on-error: true
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../verification/admin/adm1/evidence
          ./gradlew test \
            --tests com.jc.backend.admin.security.AdminSecurityIntegrationTest \
            --tests com.jc.backend.database.DatabaseRoleRoutingIntegrationTest \
            --console=plain --no-daemon 2>&1 \
            | tee ../verification/admin/adm1/evidence/adm1-admin-postgres.log
      - name: Upload Admin test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adm1-admin-postgres-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            verification/admin/adm1/evidence/adm1-admin-postgres.log
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
          if-no-files-found: error
      - name: Enforce Admin PostgreSQL test result
        if: steps.admin_tests.outcome == 'failure'
        run: exit 1

  independent_verifier:
    needs: [contract_and_scope, admin_postgres_security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run independent verifier
        run: python verification/admin/adm1/verify_adm1.py --check all
      - name: Upload ADM-1 verifier evidence
        uses: actions/upload-artifact@v6
        with:
          name: adm1-security-foundation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/admin/adm1/evidence/adm1-verification-evidence.json
          if-no-files-found: error
