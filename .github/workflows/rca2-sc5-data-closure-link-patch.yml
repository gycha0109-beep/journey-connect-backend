name: RCA-2 SC-5 Data Closure Link Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rca2-sc5-data-closure-link-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Add exact Data closure continuity verifier to SC-5 allowlist
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('verification/sc-next-track/rca2-entry/run_sc_rca2_entry_verification.py')
          text = path.read_text()
          needle = '''                "verification/rca2/",
                          "verification/sc-dp1-baseline-reconciliation/run_sc_baseline_reconciliation.py",'''
          replacement = '''                "verification/rca2/",
                          "verification/data-platform-closure/run_data_platform_closure_verification.py",
                          "verification/sc-dp1-baseline-reconciliation/run_sc_baseline_reconciliation.py",'''
          if needle not in text:
              raise SystemExit('SC-5 allowlist insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/sc-next-track/rca2-entry/run_sc_rca2_entry_verification.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(sc): bind Data closure continuity into RCA2 boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
