name: ADM-1 Materialize Implementation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm1-source-intake.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adm1-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ADM-1 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Apply reviewed ADM-1 patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/adm1.patch
          git apply --index /tmp/adm1.patch
          git rm .github/workflows/adm1-source-intake.yml
          test -z "$(git diff --cached --name-only | grep -E '\.sql$|^jc-frontend/|frontend' || true)"
          python verification/admin/adm1/verify_adm1.py --check all
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gycha0109-beep"
          git config user.email "227300144+gycha0109-beep@users.noreply.github.com"
          git commit -m "feat(admin): implement database-authoritative security foundation"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
