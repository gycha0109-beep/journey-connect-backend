name: SR Search Recommendation

on:
  pull_request:
    branches:
      - main
      - agent/sr0-sr2-search-recommendation-ranking
      - agent/sr6-search-exposure-contract-design
      - agent/sr6b-search-exposure-java-contracts
      - agent/sr6f-search-ctr-metric-design
      - agent/sr6fb-search-ctr-java-contracts
      - agent/sr6fc-search-ctr-aggregate-boundary
      - agent/sr6fd-search-ctr-projection-writer
      - agent/sr6fe-search-ctr-activation-finality-governance
      - agent/sr6ff-search-ctr-nonprod-manual-foundation
      - agent/sr6fg-search-ctr-nonprod-manual-authorization
      - agent/sr6fh-search-ctr-stage-one-shot-execution
    paths:
      - "database/journey-connect-db-v2.8/**"
      - "operations/search-ctr/**"
      - "jc-backend/src/main/java/com/jc/backend/database/**"
      - "jc-backend/src/main/java/com/jc/backend/intelligence/search/**"
      - "jc-backend/src/main/java/com/jc/backend/post/PostController.java"
      - "jc-backend/src/main/kotlin/com/jc/backend/config/SecurityConfig.kt"
      - "jc-backend/src/main/resources/application.yml.sample"
      - "jc-backend/src/test/java/com/jc/backend/CanonicalPostgresInitializer.java"
      - "jc-backend/src/test/java/com/jc/backend/intelligence/search/**"
      - "jc-backend/src/test/resources/db/canonical/55_search_exposure_persistence.sql"
      - "jc-backend/src/test/resources/db/canonical/55a_search_exposure_digest_privilege.sql"
      - "jc-backend/src/test/resources/db/canonical/56_search_exposure_persistence_smoke_test.sql"
      - "jc-backend/src/test/resources/db/canonical/57_search_ctr_aggregate_boundary.sql"
      - "jc-backend/src/test/resources/db/canonical/58_search_ctr_aggregate_boundary_smoke_test.sql"
      - "jc-backend/src/test/resources/db/canonical/59_search_ctr_projection_writer.sql"
      - "jc-backend/src/test/resources/db/canonical/59a_search_ctr_writer_owner_dependency.sql"
      - "jc-backend/src/test/resources/db/canonical/60_search_ctr_projection_writer_smoke_test.sql"
      - "jc-backend/src/test/resources/db/canonical/61_search_ctr_nonprod_manual_activation_foundation.sql"
      - "jc-backend/src/test/resources/db/canonical/62_search_ctr_nonprod_manual_activation_smoke_test.sql"
      - "jc-backend/src/test/resources/db/canonical/63_search_ctr_reliability_role_noinherit_convergence.sql"
      - "jc-backend/src/test/resources/db/canonical/64_search_ctr_reliability_role_noinherit_smoke_test.sql"
      - "jc-backend/src/test/resources/db/canonical/cleanup.sql"
      - "jc-backend/src/test/resources/intelligence/search/**"
      - "jc-backend/src/test/java/com/jc/backend/post/PostControllerSearchShadowHookTest.java"
      - "docs/recommendation/SR-*.md"
      - "docs/platform/system/SR-*.md"
      - ".github/workflows/sr-search-recommendation.yml"
      - ".github/workflows/sr-search-ctr-stage-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sr-search-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search-ranking-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper execution
        working-directory: jc-backend
        run: chmod +x ./gradlew
      - name: Validate SR-6F-H/I operations package syntax and readiness contract
        run: |
          bash -n operations/search-ctr/sr6fh/execute_stage_one_shot.sh
          python3 -m py_compile \
            operations/search-ctr/sr6fh/validate_stage_endpoints.py \
            operations/search-ctr/sr6fh/sanitize_stage_evidence.py \
            operations/search-ctr/sr6fi/verify_stage_readiness.py \
            operations/search-ctr/sr6fi/render_sr6fh_binding.py \
            operations/search-ctr/sr6fi/test_verify_stage_readiness.py
          python3 operations/search-ctr/sr6fi/test_verify_stage_readiness.py
          python3 operations/search-ctr/sr6fi/verify_stage_readiness.py \
            --manifest operations/search-ctr/sr6fi/stage-readiness-manifest.env.example \
            --mode template \
            --output build/sr6fi/template-verification.json
      - name: Compile SR-6F-H operations-only entry point
        working-directory: jc-backend
        run: |
          ./gradlew \
            --init-script ../operations/search-ctr/sr6fh/stage-one-shot.init.gradle \
            compileSearchCtrStageOneShot \
            --no-build-cache --no-daemon
      - name: Run SR-0 to SR-6F-I focused tests
        working-directory: jc-backend
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        run: |
          ./gradlew :clean :test --no-build-cache --no-daemon \
            --tests 'com.jc.backend.intelligence.search.*' \
            --tests 'com.jc.backend.post.PostControllerSearchShadowHookTest' \
            --tests 'com.jc.backend.post.PostApiIntegrationTest'
      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sr-search-focused-test-evidence
          path: |
            build/sr6fi/template-verification.json
            jc-backend/build/test-results/test
            jc-backend/build/reports/tests/test
          if-no-files-found: warn
          retention-days: 30
      - name: Run protected recommendation contracts
        working-directory: jc-backend
        run: |
          ./gradlew \
            :jc-recommendation-core:coreFoundationContractTest \
            :jc-recommendation-core:javaCoreGoldenFixtureContractTest \
            :jc-recommendation-core:p1CoreContractTest \
            :jc-recommendation-core:p2CoreContractTest \
            :p1ContractVerification \
            :p2ContractVerification \
            --no-build-cache --no-daemon

  full-backend-regression:
    needs: search-ranking-postgresql
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper execution
        working-directory: jc-backend
        run: chmod +x ./gradlew
      - name: Run full clean test regression
        working-directory: jc-backend
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        run: ./gradlew :clean :test --no-build-cache --no-daemon
      - name: Upload full regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sr-search-full-backend-regression-evidence
          path: |
            jc-backend/build/test-results/test
            jc-backend/build/reports/tests/test
          if-no-files-found: warn
          retention-days: 30
