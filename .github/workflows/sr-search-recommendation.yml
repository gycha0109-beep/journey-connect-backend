name: SR Search Recommendation

on:
  pull_request:
    branches:
      - main
      - agent/sr0-sr2-search-recommendation-ranking
    paths:
      - "jc-backend/src/main/java/com/jc/backend/intelligence/search/**"
      - "jc-backend/src/main/java/com/jc/backend/post/PostController.java"
      - "jc-backend/src/main/kotlin/com/jc/backend/config/SecurityConfig.kt"
      - "jc-backend/src/main/resources/application.yml.sample"
      - "jc-backend/src/test/java/com/jc/backend/intelligence/search/**"
      - "jc-backend/src/test/java/com/jc/backend/post/PostControllerSearchShadowHookTest.java"
      - "docs/recommendation/SR-*.md"
      - ".github/workflows/sr-search-recommendation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sr-search-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search-ranking-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper execution
        working-directory: jc-backend
        run: chmod +x ./gradlew
      - name: Run SR-0 to SR-4 focused tests
        working-directory: jc-backend
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        run: |
          ./gradlew :clean :test --no-build-cache --no-daemon \
            --tests 'com.jc.backend.intelligence.search.*' \
            --tests 'com.jc.backend.post.PostControllerSearchShadowHookTest' \
            --tests 'com.jc.backend.post.PostApiIntegrationTest'
      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sr-search-focused-test-evidence
          path: |
            jc-backend/build/test-results/test
            jc-backend/build/reports/tests/test
          if-no-files-found: warn
          retention-days: 30
      - name: Run protected recommendation contracts
        working-directory: jc-backend
        run: |
          ./gradlew \
            :jc-recommendation-core:coreFoundationContractTest \
            :jc-recommendation-core:javaCoreGoldenFixtureContractTest \
            :jc-recommendation-core:p1CoreContractTest \
            :jc-recommendation-core:p2CoreContractTest \
            :p1ContractVerification \
            :p2ContractVerification \
            --no-build-cache --no-daemon

  full-backend-regression:
    needs: search-ranking-postgresql
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper execution
        working-directory: jc-backend
        run: chmod +x ./gradlew
      - name: Run full clean test regression
        working-directory: jc-backend
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        run: ./gradlew :clean :test --no-build-cache --no-daemon
      - name: Upload full regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sr-search-full-backend-regression-evidence
          path: |
            jc-backend/build/test-results/test
            jc-backend/build/reports/tests/test
          if-no-files-found: warn
          retention-days: 30
