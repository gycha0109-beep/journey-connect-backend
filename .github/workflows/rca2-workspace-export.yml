name: RCA-2 Implementation Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rca2-workspace-export.yml'
      - 'verification/rca2-bootstrap.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Record split payload integrity
        shell: bash
        run: |
          set +e
          {
            for part in verification/rca2-bootstrap.part00 verification/rca2-bootstrap.part01 verification/rca2-bootstrap.part02 verification/rca2-bootstrap.part03 verification/rca2-bootstrap.part04; do
              echo "$(basename "$part") bytes=$(wc -c < "$part") sha256=$(sha256sum "$part" | cut -d' ' -f1)"
            done
            cat verification/rca2-bootstrap.part00 verification/rca2-bootstrap.part01 \
                verification/rca2-bootstrap.part02 verification/rca2-bootstrap.part03 \
                verification/rca2-bootstrap.part04 > /tmp/rca2-bootstrap.tar.gz.b64
            echo "combined_bytes=$(wc -c < /tmp/rca2-bootstrap.tar.gz.b64)"
            echo "combined_sha256=$(sha256sum /tmp/rca2-bootstrap.tar.gz.b64 | cut -d' ' -f1)"
            base64 --decode /tmp/rca2-bootstrap.tar.gz.b64 > /tmp/rca2-bootstrap.tar.gz
            echo "decode_exit=$?"
            echo "archive_bytes=$(wc -c < /tmp/rca2-bootstrap.tar.gz)"
            echo "archive_sha256=$(sha256sum /tmp/rca2-bootstrap.tar.gz | cut -d' ' -f1)"
            tar -tzf /tmp/rca2-bootstrap.tar.gz >/tmp/rca2-list.txt 2>/tmp/rca2-tar-error.txt
            echo "tar_exit=$?"
            echo "tar_error=$(tr '\n' ' ' < /tmp/rca2-tar-error.txt)"
          } > verification/rca2-bootstrap-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/rca2-bootstrap-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m 'test(rca2): record split payload diagnostics'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
