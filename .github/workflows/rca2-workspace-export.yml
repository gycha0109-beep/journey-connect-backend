name: RCA-2 Compile Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rca2-workspace-export.yml'
      - 'jc-backend/src/main/java/com/jc/backend/recommendation/rca2/**'
      - 'jc-backend/src/test/java/com/jc/backend/recommendation/rca2/**'
      - 'jc-backend/src/main/java/com/jc/backend/recommendation/application/RecommendationFeedService.java'
      - 'jc-backend/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rca2-compile-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run RCA-2 isolated runtime tests
        working-directory: jc-backend
        run: |
          chmod +x gradlew
          ./gradlew rca2ControlledRuntimeDarkReadTest --stacktrace --no-daemon
