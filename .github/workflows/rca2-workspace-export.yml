name: RCA-2 Implementation Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rca2-workspace-export.yml'
      - 'verification/rca2-bootstrap.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply exact RCA-2 implementation payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode verification/rca2-bootstrap.tar.gz.b64 > /tmp/rca2-bootstrap.tar.gz
          tar -xzf /tmp/rca2-bootstrap.tar.gz -C .
          rm verification/rca2-bootstrap.tar.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(rca2): add controlled runtime dark-read foundation'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
