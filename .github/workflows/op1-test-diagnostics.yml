name: OP-1 Isolated Test Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/op1-test-diagnostics.yml"
      - "jc-backend/src/main/java/com/jc/backend/recommendation/rca2/**"
      - "jc-backend/src/test/java/com/jc/backend/recommendation/rca2/**"

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run isolated OP-1 tests and preserve exit code
        id: tests
        working-directory: jc-backend
        shell: bash
        run: |
          set +e
          mkdir -p ../verification/operations/op1/runtime
          chmod +x gradlew
          ./gradlew cleanTest test \
            --tests "com.jc.backend.recommendation.rca2.Rca2Op1BoundaryUnitTest" \
            --tests "com.jc.backend.recommendation.rca2.Rca2Op1EnvironmentAccessIntegrationTest" \
            --stacktrace --no-daemon 2>&1 | tee ../verification/operations/op1/runtime/isolated-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload isolated test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op1-isolated-test-diagnostics
          retention-days: 7
          if-no-files-found: error
          path: |
            verification/operations/op1/runtime/isolated-test.log
            jc-backend/build/test-results/test/**
            jc-backend/build/reports/tests/test/**
      - name: Enforce isolated test result
        if: always()
        run: exit "${{ steps.tests.outputs.exit_code }}"
