name: ADM-3 Admin Hardening and Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "jc-backend/src/main/java/com/jc/backend/admin/**"
      - "jc-backend/src/test/java/com/jc/backend/admin/**"
      - "jc-backend/src/test/java/com/jc/backend/CanonicalPostgresInitializer.java"
      - "jc-backend/src/test/resources/db/canonical/29_admin_control_plane_hardening.sql"
      - "jc-backend/src/test/resources/db/canonical/30_admin_control_plane_hardening_smoke_test.sql"
      - "database/journey-connect-db-v2.7/29_admin_control_plane_hardening.sql"
      - "database/journey-connect-db-v2.7/30_admin_control_plane_hardening_smoke_test.sql"
      - "docs/admin/adm3/**"
      - "verification/admin/adm1/verify_adm1.py"
      - "verification/admin/adm2/verify_adm2.py"
      - "verification/admin/adm3/**"
      - ".github/workflows/adm3-admin-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adm3-admin-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ADM3_BASE_SHA: ${{ github.event.pull_request.base.sha || 'e7dd0d11de9104e2be62f9ba886ddc20cfe27fad' }}
  ADM3_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract_and_scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify ADM-3 contract, migration and scope
        run: python verification/admin/adm3/verify_adm3.py --check all

  migration_clean_and_upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply clean and upgrade migration paths
        shell: bash
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres adm3_clean
          createdb -h 127.0.0.1 -U postgres adm3_upgrade
          for n in $(seq -w 1 30); do
            file=$(find jc-backend/src/test/resources/db/canonical -maxdepth 1 -name "${n}_*.sql" -print -quit)
            test -n "$file"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d adm3_clean -f "$file"
          done
          for n in $(seq -w 1 28); do
            file=$(find jc-backend/src/test/resources/db/canonical -maxdepth 1 -name "${n}_*.sql" -print -quit)
            test -n "$file"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d adm3_upgrade -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d adm3_upgrade \
            -f jc-backend/src/test/resources/db/canonical/29_admin_control_plane_hardening.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d adm3_upgrade \
            -f jc-backend/src/test/resources/db/canonical/30_admin_control_plane_hardening_smoke_test.sql
      - name: Record migration evidence
        shell: bash
        run: |
          mkdir -p verification/admin/adm3/evidence
          {
            echo "CLEAN_MIGRATION=PASS"
            echo "UPGRADE_1_28_TO_29_30=PASS"
            echo "POSTGRES_VERSION=$(psql -At -h 127.0.0.1 -U postgres -d adm3_clean -c 'show server_version')"
          } > verification/admin/adm3/evidence/adm3-migration-evidence.txt
      - uses: actions/upload-artifact@v6
        with:
          name: adm3-migration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/admin/adm3/evidence/adm3-migration-evidence.txt
          if-no-files-found: error

  admin_postgres_hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: jc-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper execution
        run: chmod +x ./gradlew
      - name: Run ADM-3 hardening, ADM-2 APIs and inherited security tests
        id: adm3_tests
        continue-on-error: true
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../verification/admin/adm3/evidence
          ./gradlew :test \
            --tests com.jc.backend.admin.AdminHardeningIntegrationTest \
            --tests com.jc.backend.admin.AdminBasicApisIntegrationTest \
            --tests com.jc.backend.admin.security.AdminSecurityIntegrationTest \
            --tests com.jc.backend.database.DatabaseRoleRoutingIntegrationTest \
            --console=plain --no-daemon 2>&1 \
            | tee ../verification/admin/adm3/evidence/adm3-postgres-tests.log
      - name: Upload ADM-3 PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adm3-admin-postgres-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            verification/admin/adm3/evidence/adm3-postgres-tests.log
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
          if-no-files-found: error
      - name: Enforce ADM-3 PostgreSQL result
        if: steps.adm3_tests.outcome == 'failure'
        run: exit 1

  independent_verifier:
    needs: [contract_and_scope, migration_clean_and_upgrade, admin_postgres_hardening]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run independent ADM-3 verifier
        run: python verification/admin/adm3/verify_adm3.py --check all
      - uses: actions/upload-artifact@v6
        with:
          name: adm3-hardening-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/admin/adm3/evidence/adm3-verification-evidence.json
          if-no-files-found: error
