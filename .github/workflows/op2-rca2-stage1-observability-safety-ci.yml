name: OP-2 RCA-2 Stage 1 Observability and Safety CI

on:
  pull_request:
    branches: [main]
    paths:
      - "jc-backend/src/main/java/com/jc/backend/recommendation/rca2/**"
      - "jc-backend/src/test/java/com/jc/backend/recommendation/rca2/**"
      - "docs/platform/operations/op2/**"
      - "verification/operations/op2/**"
      - "ops/observability/rca2/op2/**"
      - ".github/workflows/op2-rca2-stage1-observability-safety-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: op2-rca2-stage1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authoritative_baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only authoritative_baseline

  op1_continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only op1_continuity

  application_compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jc-backend
        run: chmod +x gradlew && ./gradlew compileJava compileKotlin --stacktrace --no-daemon

  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jc-backend
        run: |
          chmod +x gradlew
          ./gradlew :test --tests "com.jc.backend.recommendation.rca2.Rca2Op2TelemetryTest" --tests "com.jc.backend.recommendation.rca2.Rca2Op2AlertPolicyTest" --stacktrace --no-daemon

  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jc-backend
        run: |
          chmod +x gradlew
          ./gradlew :test --tests "com.jc.backend.recommendation.rca2.Rca2Op2RuntimeSafetyTest" --tests "com.jc.backend.recommendation.rca2.Rca2Op1EnvironmentAccessIntegrationTest" --stacktrace --no-daemon

  metric_continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only metric_continuity

  metric_instrumentation:
    runs-on: ubuntu-latest
    needs: application_compile
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jc-backend
        run: chmod +x gradlew && ./gradlew :test --tests "com.jc.backend.recommendation.rca2.Rca2Op2TelemetryTest" --stacktrace --no-daemon

  metric_redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only metric_redaction

  dashboard_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only dashboard_contract

  critical_alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jc-backend
        run: chmod +x gradlew && ./gradlew :test --tests "com.jc.backend.recommendation.rca2.Rca2Op2AlertPolicyTest" --stacktrace --no-daemon

  warning_alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only warning_alerts

  kill_switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jc-backend
        run: chmod +x gradlew && ./gradlew :test --tests "com.jc.backend.recommendation.rca2.Rca2Op2RuntimeSafetyTest" --stacktrace --no-daemon

  rollback_levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only rollback_levels

  effective_zero_traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only effective_zero_traffic

  runtime_side_effect_protection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jc-backend
        run: |
          chmod +x gradlew
          ./gradlew :test --tests "com.jc.backend.recommendation.rca2.Rca2RuntimeOrchestratorTest" --tests "com.jc.backend.recommendation.rca2.Rca2StaticBoundaryTest" --tests "com.jc.backend.recommendation.rca2.Rca2ResponseMutationVerifierTest" --tests "com.jc.backend.recommendation.rca2.Rca2CredentialNetworkRollbackTest" --stacktrace --no-daemon

  historical_evidence_protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only historical_evidence_protection

  sql_protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD" --only sql_protection

  independent_verifier:
    runs-on: ubuntu-latest
    needs: [authoritative_baseline, op1_continuity, application_compile, unit_tests, integration_tests, metric_continuity, metric_instrumentation, metric_redaction, dashboard_contract, critical_alerts, warning_alerts, kill_switch, rollback_levels, effective_zero_traffic, runtime_side_effect_protection, historical_evidence_protection, sql_protection]
    if: always()
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ env.EXACT_HEAD }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - name: Verify prerequisite job results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: python -c 'import json,os,sys; n=json.loads(os.environ["NEEDS_JSON"]); bad={k:v["result"] for k,v in n.items() if v["result"]!="success"}; print(bad); sys.exit(bool(bad))'
      - name: Run exact-head independent verifier
        run: python verification/operations/op2/run_op2_verification.py --expected-head "$EXACT_HEAD"
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op2-rca2-stage1-observability-safety-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            verification/operations/op2/runtime/**
            verification/operations/op2/contracts/**
            docs/platform/operations/op2/**
            ops/observability/rca2/op2/**
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
