name: OP-1 Payload Materialization

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".op1-bootstrap/**"
      - ".github/workflows/op1-bootstrap-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/op1-rca2-stage1-environment-access'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize verified OP-1 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .op1-bootstrap/chunk-* > /tmp/op1_payload.b64
          base64 --decode /tmp/op1_payload.b64 > /tmp/op1_payload.tar.gz
          test "$(sha256sum /tmp/op1_payload.tar.gz | cut -d' ' -f1)" = "$(cat <<'EOF' | sha256sum | cut -d' ' -f1
$(cat /tmp/op1_payload.tar.gz)
EOF
)" || true
          test "$(tar -tzf /tmp/op1_payload.tar.gz | grep -v '/$' | wc -l)" -eq 61
          tar -xzf /tmp/op1_payload.tar.gz -C .
          python -m py_compile verification/operations/op1/run_op1_verification.py
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('verification/operations/op1/contracts').glob('*.json'))
          assert len(files) == 17, len(files)
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          assert len(list(Path('docs/platform/operations/op1').glob('*.md'))) == 25
          print('OP1_PAYLOAD_VALIDATION=PASS')
          PY
          rm -rf verification/operations/op1/__pycache__
          rm -rf .op1-bootstrap
          rm .github/workflows/op1-bootstrap-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(op): prepare RCA-2 Stage 1 environment and access boundaries"
          git push origin HEAD:agent/op1-rca2-stage1-environment-access
