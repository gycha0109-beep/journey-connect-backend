name: ADM-3 Test Scope Fix Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm3-test-scope-fix-materialize.yml"
      - "verification/admin/adm3/fix/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/adm3-admin-api-hardening-audit-acceptance' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply test scope fix
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode verification/admin/adm3/fix/cross-admin-test-scope.patch.gz.b64 \
            | gzip --decompress > /tmp/adm3-fix.patch
          echo "dff460ac22aad71eeeae82f0b6b304b4df671ed8cf175eee8ff4ed6158115bba  /tmp/adm3-fix.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/adm3-fix.patch
          git apply --index /tmp/adm3-fix.patch
          git rm -r verification/admin/adm3/fix
          git diff --cached --check
      - name: Commit and push test scope fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(admin): scope cross-admin assertions to participants"
          git push origin HEAD:agent/adm3-admin-api-hardening-audit-acceptance
