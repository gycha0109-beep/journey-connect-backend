name: ADM-2 Materialize Implementation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm2-materialize.yml"
      - "verification/admin/adm2/materialize/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adm2-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ADM-2 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/adm2-admin-moderation-basic-management-apis' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified ADM-2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat verification/admin/adm2/materialize/part-*.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/adm2.patch
          echo "53dbc97de7a4523e7c64895765520741b80db0552fc87c08296157fe3be4556a  /tmp/adm2.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/adm2.patch
          git apply --index /tmp/adm2.patch
          git rm -r verification/admin/adm2/materialize
          git rm .github/workflows/adm2-materialize.yml
          git diff --cached --check
          git status --short
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(admin): implement moderation and basic management APIs"
          git push origin HEAD:agent/adm2-admin-moderation-basic-management-apis
