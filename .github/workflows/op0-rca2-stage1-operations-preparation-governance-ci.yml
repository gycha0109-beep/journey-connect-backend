name: OP-0 RCA-2 Stage 1 Operations Preparation Governance CI

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/platform/operations/op0/**"
      - "verification/operations/op0/**"
      - ".github/workflows/op0-rca2-stage1-operations-preparation-governance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: op0-rca2-stage1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoritative_baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only authoritative_baseline

  sc6_continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only sc6_continuity

  document_completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only document_completeness

  machine_readable_artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only machine_readable_artifacts

  workstream_ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only workstream_ownership

  dependency_and_gate_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only dependency_and_gate_validation

  runtime_and_traffic_immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only runtime_and_traffic_immutability

  historical_evidence_protection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only historical_evidence_protection

  sql_protection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" --only sql_protection

  independent_verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - authoritative_baseline
      - sc6_continuity
      - document_completeness
      - machine_readable_artifacts
      - workstream_ownership
      - dependency_and_gate_validation
      - runtime_and_traffic_immutability
      - historical_evidence_protection
      - sql_protection
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run exact-head independent verifier
        run: python verification/operations/op0/run_op0_verification.py --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Print exact tested SHA
        run: echo "EXACT_TESTED_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload OP-0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op0-rca2-stage1-operations-preparation-evidence
          retention-days: 90
          if-no-files-found: error
          path: verification/operations/op0/runtime/**
