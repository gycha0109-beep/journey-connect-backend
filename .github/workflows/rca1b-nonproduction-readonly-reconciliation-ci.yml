name: RCA-1B Non-production Read-only Reconciliation CI

on:
  pull_request:
    branches: [main]
    paths:
      - "jc-backend/src/test/java/com/jc/backend/recommendation/dataadoption/reconciliation/database/**"
      - "jc-backend/src/test/resources/recommendation-data-adoption/rca1b/**"
      - "verification/rca1b/**"
      - "docs/platform/recommendation/RCA-1B-*.md"
      - ".github/workflows/rca1b-nonproduction-readonly-reconciliation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rca1b-nonproduction-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgresql-reconciliation:
    name: PostgreSQL ${{ matrix.postgres }} read-only reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper permission
        run: chmod +x jc-backend/gradlew
      - name: Execute PostgreSQL matrix reconciliation
        working-directory: jc-backend
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: |
          set -o pipefail
          ./gradlew :test \
            --tests com.jc.backend.recommendation.dataadoption.reconciliation.database.Rca1bDatabaseReconciliationTest \
            -Drca1b.testedSha=${{ github.event.pull_request.head.sha || github.sha }} \
            --stacktrace --no-daemon \
            2>&1 | tee ../verification/rca1b/runtime/RCA1B_POSTGRESQL_${{ matrix.postgres }}.log
      - name: Run independent per-version verifier
        run: |
          set -o pipefail
          python verification/rca1b/run_rca1b_verification.py --database-version ${{ matrix.postgres }} \
            2>&1 | tee verification/rca1b/runtime/RCA1B_VERIFIER_PG${{ matrix.postgres }}.log
      - name: Upload PostgreSQL reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rca1b-postgresql-${{ matrix.postgres }}-evidence
          retention-days: 90
          path: |
            verification/rca1b/runtime/postgresql-${{ matrix.postgres }}/**
            verification/rca1b/runtime/RCA1B_POSTGRESQL_${{ matrix.postgres }}.log
            verification/rca1b/runtime/RCA1B_VERIFIER_PG${{ matrix.postgres }}.log
            verification/rca1b/runtime/RCA1B_VERIFICATION_SUMMARY_PG${{ matrix.postgres }}.*
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
          if-no-files-found: error

  cross-version-equivalence:
    name: PostgreSQL 15/18 normalized equivalence
    needs: postgresql-reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download both matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rca1b-postgresql-*-evidence
          path: verification/rca1b/downloaded
          merge-multiple: false
      - name: Compare normalized PostgreSQL results
        run: |
          python verification/rca1b/compare_rca1b_versions.py verification/rca1b/downloaded \
            --output verification/rca1b/runtime/cross-version
      - name: Re-run static independent verifier on exact head
        run: python verification/rca1b/run_rca1b_verification.py
      - name: Upload cross-version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rca1b-cross-version-equivalence-evidence
          retention-days: 90
          path: |
            verification/rca1b/runtime/cross-version/**
            verification/rca1b/runtime/RCA1B_VERIFICATION_SUMMARY_STATIC.*
          if-no-files-found: error

  protected-regressions:
    name: RCA-0/RCA-1/Core/Backend protected regression
    needs: cross-version-equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper permission
        run: chmod +x jc-backend/gradlew
      - name: Execute immutable RCA-0 fixture regression
        shell: bash
        run: |
          set -o pipefail
          build="$(mktemp -d)"
          javac --release 21 -Xlint:all -Werror -d "$build" \
            jc-backend/src/main/java/com/jc/backend/recommendation/dataadoption/*.java \
            verification/rca0/java/com/jc/backend/recommendation/dataadoption/Rca0ContractTestMain.java
          java -cp "$build" com.jc.backend.recommendation.dataadoption.Rca0ContractTestMain \
            jc-backend/src/test/resources/recommendation-data-adoption/p1-fixtures-v1.tsv \
            jc-backend/src/test/resources/recommendation-data-adoption/p2-fixtures-v1.tsv \
            | tee verification/rca1b/runtime/RCA0_REGRESSION.log
      - name: Execute immutable RCA-1 fixture regression
        shell: bash
        run: |
          set -o pipefail
          build="$(mktemp -d)"
          javac --release 21 -Xlint:all -Werror -d "$build" \
            jc-backend/src/main/java/com/jc/backend/recommendation/dataadoption/reconciliation/*.java \
            verification/rca1/java/com/jc/backend/recommendation/dataadoption/reconciliation/Rca1ReconciliationTestMain.java
          java -cp "$build" com.jc.backend.recommendation.dataadoption.reconciliation.Rca1ReconciliationTestMain \
            jc-backend/src/test/resources/recommendation-data-adoption/reconciliation/p1-reconciliation-fixtures-v1.tsv \
            jc-backend/src/test/resources/recommendation-data-adoption/reconciliation/p2-reconciliation-fixtures-v1.tsv \
            verification/rca1b/runtime/rca1-regression \
            ${{ github.event.pull_request.head.sha || github.sha }} \
            | tee verification/rca1b/runtime/RCA1_REGRESSION.log
      - name: Run Recommendation core regression
        working-directory: jc-backend
        run: ./gradlew :jc-recommendation-core:check --stacktrace --no-daemon
      - name: Run backend and IP-12.5 protected readiness
        working-directory: jc-backend
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        run: |
          set -o pipefail
          ./gradlew verifyIp125 -Drca1b.testedSha=${{ github.event.pull_request.head.sha || github.sha }} \
            --stacktrace --no-daemon 2>&1 | tee ../verification/rca1b/runtime/IP125_PROTECTED_REGRESSION.log
      - name: Final exact-head static verification
        run: python verification/rca1b/run_rca1b_verification.py
      - name: Upload protected regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rca1b-protected-regression-evidence
          retention-days: 90
          path: |
            verification/rca1b/runtime/RCA0_REGRESSION.log
            verification/rca1b/runtime/RCA1_REGRESSION.log
            verification/rca1b/runtime/IP125_PROTECTED_REGRESSION.log
            verification/rca1b/runtime/RCA1B_VERIFICATION_SUMMARY_STATIC.*
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
            jc-backend/jc-recommendation-core/build/test-results/**/*.xml
            jc-backend/jc-recommendation-core/build/reports/tests/**
          if-no-files-found: warn
