name: ADM-5 Exact Source Export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm5-source-export.yml"
  push:
    branches:
      - agent/adm5-frontend-integration-acceptance-delivery
    paths:
      - ".github/workflows/adm5-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > ADM5-SOURCE-HEAD.txt
          tar --exclude=.git -czf /tmp/adm5-source.tar.gz .
          cp /tmp/adm5-source.tar.gz ./adm5-source.tar.gz
          sha256sum adm5-source.tar.gz > ADM5-SOURCE-SHA256.txt
      - uses: actions/upload-artifact@v6
        with:
          name: adm5-exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            adm5-source.tar.gz
            ADM5-SOURCE-HEAD.txt
            ADM5-SOURCE-SHA256.txt
          if-no-files-found: error
