name: ADM-3 Temporary Recovery Commit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  recover-and-self-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Apply successor-aware verifier recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          java_path = Path("jc-backend/src/test/java/com/jc/backend/recommendation/rca2/Rca2StaticBoundaryTest.java")
          java_path.write_text('''package com.jc.backend.recommendation.rca2;

          import static org.assertj.core.api.Assertions.assertThat;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Comparator;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.stream.Stream;
          import org.junit.jupiter.api.Test;

          class Rca2StaticBoundaryTest {
              private static final Path ROOT = locateRepositoryRoot();
              private static final Pattern SQL_FILE = Pattern.compile("^(\\\\d{2})_.*\\\\.sql$");

              @Test void defaultsRemainOffZeroAndProductionIsExcluded() throws Exception {
                  String config = Files.readString(ROOT.resolve("jc-backend/src/main/resources/application-rca2-isolated-nonproduction.yml"));
                  assertThat(config).contains("flag: off", "traffic-percent: 0", "max-production-dark-read-percent: 0",
                          "production-route-allowed: false", "config-signature-verified: false");
                  String spring = Files.readString(ROOT.resolve("jc-backend/src/main/java/com/jc/backend/recommendation/rca2/Rca2SpringConfiguration.java"));
                  assertThat(spring).contains("!prod", "!production", "Rca2BoundedExecutor")
                          .doesNotContain("ForkJoinPool", "newCachedThreadPool", "CallerRunsPolicy");
              }

              @Test void canonicalSuccessorMigrationsExistAndPersistentRca2ObjectsAreAbsent() throws Exception {
                  Path db = ROOT.resolve("database/journey-connect-db-v2.7");
                  List<Path> scripts;
                  try (Stream<Path> files = Files.list(db)) {
                      scripts = files.filter(Files::isRegularFile)
                              .filter(path -> SQL_FILE.matcher(path.getFileName().toString()).matches())
                              .sorted(Comparator.comparingInt(Rca2StaticBoundaryTest::sqlNumber))
                              .toList();
                  }
                  assertThat(scripts).hasSize(54);
                  for (int index = 0; index < scripts.size(); index++) {
                      assertThat(sqlNumber(scripts.get(index))).isEqualTo(index + 1);
                  }
                  assertThat(scripts.get(52).getFileName().toString())
                          .isEqualTo("53_admin_control_plane_hardening.sql");
                  assertThat(scripts.get(53).getFileName().toString())
                          .isEqualTo("54_admin_control_plane_hardening_smoke_test.sql");
                  assertThat(scripts).noneMatch(path -> path.getFileName().toString().toLowerCase().contains("rca2"));

                  try (Stream<Path> files = Files.walk(ROOT.resolve("jc-backend/src/main/java/com/jc/backend/recommendation/rca2"))) {
                      for (Path path : files.filter(Files::isRegularFile).toList()) {
                          String source = Files.readString(path);
                          assertThat(source).doesNotContain("JpaRepository", "JdbcTemplate", "EntityManager", "ApplicationEventPublisher",
                                  "KafkaTemplate", "Repository.save", "flush()", "@Transactional", "production.example", "jdbc:postgresql://prod");
                      }
                  }
              }

              private static int sqlNumber(Path path) {
                  Matcher matcher = SQL_FILE.matcher(path.getFileName().toString());
                  if (!matcher.matches()) {
                      throw new IllegalArgumentException("not a canonical SQL file: " + path);
                  }
                  return Integer.parseInt(matcher.group(1));
              }

              private static Path locateRepositoryRoot() {
                  Path current = Path.of("").toAbsolutePath().normalize();
                  for (Path candidate = current; candidate != null; candidate = candidate.getParent()) {
                      if (Files.isRegularFile(candidate.resolve("jc-backend/build.gradle.kts"))
                              && Files.isDirectory(candidate.resolve("database"))) {
                          return candidate;
                      }
                  }
                  throw new IllegalStateException("RCA-2 repository root not found from " + current);
              }
          }
          '''.replace("          ", ""), encoding="utf-8")

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block absent: {path}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "verification/rca1b/run_rca1b_verification.py",
              '''    def sql_protection() -> str:
                  directory = ROOT / "database/journey-connect-db-v2.7"
                  inventory = []
                  for path in directory.glob("*.sql"):
                      match = re.match(r"(\\d+)_", path.name)
                      if match:
                          inventory.append(int(match.group(1)))
                  need(len(inventory) == 52 and set(inventory) == set(range(1, 53)), "SQL 01..52 inventory")
                  need(not list(directory.glob("5[3-9]_*.sql")) and not list(directory.glob("[6-9][0-9]_*.sql")), "SQL 53+ exists")
                  return "canonical SQL 01..52 exact and 53+ absent"
          ''',
              '''    def sql_protection() -> str:
                  directory = ROOT / "database/journey-connect-db-v2.7"
                  scripts: dict[int, list[Path]] = {}
                  for path in directory.glob("*.sql"):
                      match = re.fullmatch(r"(\\d{2})_.*\\.sql", path.name)
                      if match:
                          scripts.setdefault(int(match.group(1)), []).append(path)
                  need(set(scripts) == set(range(1, 55)), "SQL 01..54 inventory")
                  need(all(len(paths) == 1 for paths in scripts.values()), "duplicate canonical SQL version")
                  need(scripts[53][0].name == "53_admin_control_plane_hardening.sql", "unexpected SQL 53 owner")
                  need(scripts[54][0].name == "54_admin_control_plane_hardening_smoke_test.sql", "unexpected SQL 54 owner")
                  return "canonical SQL 01..52 protected with exact ADM-3 successor 53/54"
          ''',
          )

          replace(
              "verification/rca2/run_rca2_verification.py",
              '''    sql=[]
              for p in (repo/"database").rglob("*.sql"):
                  m=re.match(r"(?:V)?(\\d+)",p.name)
                  if m: sql.append((int(m.group(1)),str(p.relative_to(repo))))
              check("sql_01_52_protected", bool(sql) and max(n for n,_ in sql)==52, f"max_sql={max(n for n,_ in sql) if sql else 'none'}")
              check("sql_53_plus_absent", not any(n>=53 for n,_ in sql), "SQL 53+ absent")
              check("db_change_none", not any("rca2" in path.lower() for _,path in sql), "no RCA-2 SQL")
          ''',
              '''    canonical=repo/"database/journey-connect-db-v2.7"
              sql=[]
              for p in canonical.glob("*.sql"):
                  m=re.fullmatch(r"(\\d{2})_.*\\.sql",p.name)
                  if m: sql.append((int(m.group(1)),str(p.relative_to(repo))))
              inventory={}
              for number,path in sql: inventory.setdefault(number,[]).append(path)
              check("sql_01_52_protected", set(range(1,53)).issubset(inventory) and all(len(inventory[n])==1 for n in range(1,53)), "canonical SQL 01..52 unique")
              check("sql_53_54_successor_only", set(inventory)==set(range(1,55)) and all(len(paths)==1 for paths in inventory.values()) and inventory[53][0].endswith("53_admin_control_plane_hardening.sql") and inventory[54][0].endswith("54_admin_control_plane_hardening_smoke_test.sql"), "exact ADM-3 successor SQL 53/54")
              check("db_change_none", not any("rca2" in path.lower() for _,path in sql), "no RCA-2 SQL")
          ''',
          )

          verifier = Path("verification/admin/adm3/verify_adm3.py")
          text = verifier.read_text(encoding="utf-8")
          text = text.replace('require(production == canonical, "29 migration canonical copy mismatch")', 'require(production == canonical, "53 migration canonical copy mismatch")')
          text = text.replace('require(smoke == canonical_smoke, "30 smoke canonical copy mismatch")', 'require(smoke == canonical_smoke, "54 smoke canonical copy mismatch")')
          text = text.replace(
              '''        if path == ".github/workflows/adm3-successor-fix-materialize.yml"
                  or path == ".github/workflows/adm3-recovery-materialize.yml"
                  or path.startswith("verification/admin/adm3/fix/")
                  or path.startswith("verification/admin/adm3/snapshot/")
                  or any(token in path.lower() for token in ("payload", "chunk-", "part-"))
          ''',
              '''        if path == ".github/workflows/adm3-successor-fix-materialize.yml"
                  or path == ".github/workflows/adm3-recovery-materialize.yml"
                  or path == ".github/workflows/adm3-temporary-source-export.yml"
                  or path.startswith("verification/admin/adm3/fix/")
                  or path.startswith("verification/admin/adm3/snapshot/")
                  or any(
                      token in path.lower()
                      for token in (
                          "materializ", "payload", "chunk-", "part-", "base64", "hex-snapshot",
                          "extract-script", "staging-only", "debug-output",
                      )
                  )
          ''',
          )
          text = text.replace(
              '''        "jc-backend/src/test/java/com/jc/backend/recommendation/dataadoption/reconciliation/database/Rca1bDatabaseReconciliationTest.java",
                  *SQL_PATHS,
          ''',
              '''        "jc-backend/src/test/java/com/jc/backend/recommendation/dataadoption/reconciliation/database/Rca1bDatabaseReconciliationTest.java",
                  "jc-backend/src/test/java/com/jc/backend/recommendation/rca2/Rca2StaticBoundaryTest.java",
                  "verification/rca1b/run_rca1b_verification.py",
                  "verification/rca2/run_rca2_verification.py",
                  *SQL_PATHS,
          ''',
          )
          verifier.write_text(text, encoding="utf-8")

          replace(
              "docs/admin/adm3/ADM-3-ADMIN-API-HARDENING-AUDIT-ACCEPTANCE.md",
              "Clean bootstrap and 1-28 to 29-30 upgrade paths are independently executed in CI.",
              "Clean bootstrap through 54 and upgrade from the protected 01-52 baseline through 53-54 are independently executed in CI.",
          )
          PY

          python -m py_compile \
            verification/rca1b/run_rca1b_verification.py \
            verification/rca2/run_rca2_verification.py \
            verification/admin/adm3/verify_adm3.py

          python - <<'PY'
          from pathlib import Path
          import re
          directory = Path("database/journey-connect-db-v2.7")
          scripts = {}
          for path in directory.glob("*.sql"):
              match = re.fullmatch(r"(\d{2})_.*\.sql", path.name)
              if match:
                  scripts.setdefault(int(match.group(1)), []).append(path)
          assert set(scripts) == set(range(1, 55))
          assert all(len(paths) == 1 for paths in scripts.values())
          assert scripts[53][0].name == "53_admin_control_plane_hardening.sql"
          assert scripts[54][0].name == "54_admin_control_plane_hardening_smoke_test.sql"
          PY

          rm .github/workflows/adm3-temporary-source-export.yml
          git diff --check
      - name: Commit recovery and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jc-backend/src/test/java/com/jc/backend/recommendation/rca2/Rca2StaticBoundaryTest.java \
            verification/rca1b/run_rca1b_verification.py \
            verification/rca2/run_rca2_verification.py \
            verification/admin/adm3/verify_adm3.py \
            docs/admin/adm3/ADM-3-ADMIN-API-HARDENING-AUDIT-ACCEPTANCE.md \
            .github/workflows/adm3-temporary-source-export.yml
          git commit -m "fix(adm3): align successor migration verification"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
