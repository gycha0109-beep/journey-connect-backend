name: ADM-5 HTTP Harness Repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm5-http-harness-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Repair psql result parsing and failure evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('verification/admin/adm5/http_acceptance.py')
          source = path.read_text()
          source = source.replace(
              '    return result.stdout.strip()\n',
              '    lines = [line for line in result.stdout.splitlines() if line.strip()]\n    return lines[0].strip() if lines else ""\n',
              1,
          )
          source = source.replace(
              '"failure": type(exc).__name__, "checks": checks',
              '"failure": type(exc).__name__, "message": str(exc), "checks": checks',
              1,
          )
          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/admin/adm5/http_acceptance.py
          git diff --cached --check
          git commit -m "fix(adm5): parse psql returning rows deterministically"
          git push origin HEAD:agent/adm5-frontend-integration-acceptance-delivery
