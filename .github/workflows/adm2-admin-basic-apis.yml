name: ADM-2 Admin Basic APIs

on:
  pull_request:
    branches: [main]
    paths:
      - "jc-backend/src/main/java/com/jc/backend/admin/**"
      - "jc-backend/src/test/java/com/jc/backend/admin/**"
      - "docs/admin/adm2/**"
      - "verification/admin/adm2/**"
      - ".github/workflows/adm2-admin-basic-apis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adm2-admin-basic-apis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ADM2_BASE_SHA: ${{ github.event.pull_request.base.sha || 'd4e1189953fe81a0df8ddc680c60076bf8fb51c4' }}
  ADM2_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract_and_scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify ADM-2 contract and scope
        run: python verification/admin/adm2/verify_adm2.py --check all

  admin_postgres_apis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jc-backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Grant Gradle wrapper execution
        run: chmod +x ./gradlew
      - name: Run ADM-2 PostgreSQL API and inherited security tests
        id: adm2_tests
        continue-on-error: true
        env:
          JC_TEST_POSTGRES_IMAGE: postgres:15-alpine
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../verification/admin/adm2/evidence
          ./gradlew :test \
            --tests com.jc.backend.admin.AdminBasicApisIntegrationTest \
            --tests com.jc.backend.admin.security.AdminSecurityIntegrationTest \
            --tests com.jc.backend.database.DatabaseRoleRoutingIntegrationTest \
            --console=plain --no-daemon 2>&1 \
            | tee ../verification/admin/adm2/evidence/adm2-postgres-tests.log
      - name: Upload ADM-2 PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adm2-admin-postgres-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            verification/admin/adm2/evidence/adm2-postgres-tests.log
            jc-backend/build/test-results/**/*.xml
            jc-backend/build/reports/tests/**
          if-no-files-found: error
      - name: Enforce ADM-2 PostgreSQL result
        if: steps.adm2_tests.outcome == 'failure'
        run: exit 1

  independent_verifier:
    needs: [contract_and_scope, admin_postgres_apis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run independent ADM-2 verifier
        run: python verification/admin/adm2/verify_adm2.py --check all
      - uses: actions/upload-artifact@v6
        with:
          name: adm2-basic-apis-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/admin/adm2/evidence/adm2-verification-evidence.json
          if-no-files-found: error
