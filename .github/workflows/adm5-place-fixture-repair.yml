name: ADM-5 Place Fixture Repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm5-place-fixture-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Create deterministic local-only place fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('verification/admin/adm5/http_acceptance.py')
          source = path.read_text()
          old = '''    place_id = int(sql("select id from public.places where region_id in (select id from public.regions where slug like 'kr-seoul%') order by id limit 1"))\n'''
          new = '''    place_id = int(sql(\n        f"insert into public.places(region_id,name_local,name_ko,name_en,address,latitude,longitude,category,is_active) "\n        f"values ({region_id},'ADM5 Demo Place','ADM5 시연 장소','ADM5 Demo Place','Local-only fixture',37.566500,126.978000,'demo',true) returning id"\n    ))\n'''
          if old not in source:
              raise SystemExit('expected place lookup not found')
          path.write_text(source.replace(old, new, 1))
          PY
          python -m py_compile verification/admin/adm5/http_acceptance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/admin/adm5/http_acceptance.py
          git diff --cached --check
          git commit -m "fix(adm5): create deterministic local place fixture"
          git push origin HEAD:agent/adm5-frontend-integration-acceptance-delivery
