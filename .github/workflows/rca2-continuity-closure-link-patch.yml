name: RCA-2 Continuity Closure Link Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rca2-continuity-closure-link-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Close RCA Data SC DP verifier linkage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'verification/data-platform-closure/run_data_platform_closure_verification.py': (
                  '''        "verification/dp7/run_dp7_allocation_verification.py",
                  "verification/dp7/run_dp7_static_verification.py",''',
                  '''        "verification/dp6/run_dp6_allocation_verification.py",
                  "verification/dp7/run_dp7_allocation_verification.py",
                  "verification/dp7/run_dp7_static_verification.py",'''
              ),
              'verification/sc-next-track/rca2-entry/run_sc_rca2_entry_verification.py': (
                  '''                "verification/data-platform-closure/run_data_platform_closure_verification.py",
                          "verification/sc-dp1-baseline-reconciliation/run_sc_baseline_reconciliation.py",''',
                  '''                "verification/data-platform-closure/run_data_platform_closure_verification.py",
                          "verification/dp6/run_dp6_allocation_verification.py",
                          "verification/dp7/run_dp7_allocation_verification.py",
                          "verification/sc-dp1-baseline-reconciliation/run_sc_baseline_reconciliation.py",'''
              ),
              'verification/rca1/run_rca1_verification.py': (
                  '''                "verification/rca2/",
                          "verification/sc-dp1-baseline-reconciliation/",''',
                  '''                "verification/rca2/",
                          "verification/data-platform-closure/run_data_platform_closure_verification.py",
                          "verification/dp6/run_dp6_allocation_verification.py",
                          "verification/dp7/run_dp7_allocation_verification.py",
                          "verification/sc-dp1-baseline-reconciliation/",'''
              ),
              'verification/rca1b/run_rca1b_verification.py': (
                  '''            "verification/rca2/",
                      "verification/sc-dp1-baseline-reconciliation/",''',
                  '''            "verification/rca2/",
                      "verification/data-platform-closure/run_data_platform_closure_verification.py",
                      "verification/dp6/run_dp6_allocation_verification.py",
                      "verification/dp7/run_dp7_allocation_verification.py",
                      "verification/sc-dp1-baseline-reconciliation/",'''
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'continuity insertion point not found: {filename}')
              path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/data-platform-closure/run_data_platform_closure_verification.py \
                  verification/sc-next-track/rca2-entry/run_sc_rca2_entry_verification.py \
                  verification/rca1/run_rca1_verification.py \
                  verification/rca1b/run_rca1b_verification.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(rca2): close historical continuity verifier linkage'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
