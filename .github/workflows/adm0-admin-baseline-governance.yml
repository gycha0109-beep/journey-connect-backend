name: ADM-0 Admin Baseline Governance

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/admin/adm0/**"
      - "verification/admin/adm0/**"
      - ".github/workflows/adm0-admin-baseline-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adm0-admin-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authoritative_backend_baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check authoritative_backend_baseline
        env: { GITHUB_TOKEN: "${{ github.token }}" }

  youngtak_source_intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check youngtak_source_intake
        env: { GITHUB_TOKEN: "${{ github.token }}" }

  admin_ui_assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check admin_ui_assessment

  capability_matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check capability_matrix

  schema_inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check schema_inventory

  migration_plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check migration_plan

  api_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check api_contract

  authorization_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check authorization_contract

  audit_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check audit_contract

  repository_integration_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check repository_integration_contract

  scope_protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check scope_protection

  historical_evidence_protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check historical_evidence_protection

  sql_protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check sql_protection

  independent_verifier:
    runs-on: ubuntu-latest
    needs:
      - authoritative_backend_baseline
      - youngtak_source_intake
      - admin_ui_assessment
      - capability_matrix
      - schema_inventory
      - migration_plan
      - api_contract
      - authorization_contract
      - audit_contract
      - repository_integration_contract
      - scope_protection
      - historical_evidence_protection
      - sql_protection
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python verification/admin/adm0/verify_adm0.py --check independent_verifier
      - uses: actions/upload-artifact@v6
        with:
          name: adm0-admin-baseline-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/admin/adm0/evidence/adm0-verification-evidence.json
          if-no-files-found: error
