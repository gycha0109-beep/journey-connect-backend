name: SC OP-3 Entry Governance CI

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/platform/governance/sc-next-track/57-*"
      - "docs/platform/governance/sc-next-track/58-*"
      - "docs/platform/governance/sc-next-track/59-*"
      - "docs/platform/governance/sc-next-track/60-*"
      - "docs/platform/governance/sc-next-track/61-*"
      - "verification/sc-next-track/op3-entry/**"
      - ".github/workflows/sc-op3-entry-governance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  sc_op3_entry_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify OP-3 entry remains blocked
        run: python verification/sc-next-track/op3-entry/run_sc_op3_entry_verification.py
      - name: Verify external work orders and live issue state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python verification/sc-next-track/op3-entry/run_sc_op3_external_resolution_verification.py --require-live-issues
      - run: echo "EXACT_TESTED_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
