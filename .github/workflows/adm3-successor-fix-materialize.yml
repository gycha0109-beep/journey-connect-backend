name: ADM-3 Successor Fix Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm3-successor-fix-materialize.yml"
      - "verification/admin/adm3/workflow-export.py.gz.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/adm3-admin-api-hardening-audit-acceptance' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate verified formal workflows
        shell: bash
        run: |
          set -euo pipefail
          payload=verification/admin/adm3/workflow-export.py.gz.b64
          base64 --decode "$payload" > /tmp/adm3-workflow-export.py.gz
          echo "c0f4edc5ce57558d748dc0ce1809e65170fcef222c8fe8eb2b440c3dcf443c76  /tmp/adm3-workflow-export.py.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/adm3-workflow-export.py.gz > /tmp/adm3-workflow-export.py
          echo "eda77dc4430cbb409adcb695e732a81ec3ac1f048010f09316c1d224702cd1d7  /tmp/adm3-workflow-export.py" | sha256sum --check --strict
          python /tmp/adm3-workflow-export.py
      - name: Upload recovered formal workflows
        uses: actions/upload-artifact@v6
        with:
          name: adm3-recovered-formal-workflows-${{ github.sha }}
          path: /tmp/adm3-workflows
          if-no-files-found: error
