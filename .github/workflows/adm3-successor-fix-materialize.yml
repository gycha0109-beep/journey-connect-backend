name: ADM-3 Successor Fix Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm3-successor-fix-materialize.yml"
      - "verification/admin/adm3/recovery/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adm3-successor-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/adm3-admin-api-hardening-audit-acceptance' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and execute ADM-3 recovery
        id: recovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/adm3-recovery.log
          payload=verification/admin/adm3/recovery/recovery.sh.gz.b64
          base64 --decode "$payload" > /tmp/adm3-recovery.sh.gz
          echo "37018c9cd078711b4c38645dc724ea29e91f39c6c1a732f94a00c21bb53e72a2  /tmp/adm3-recovery.sh.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/adm3-recovery.sh.gz > /tmp/adm3-recovery.sh
          echo "a7a5836fa36033affd693fc5f81b8ca73793eca4ff3225eb8e33b6487c78c065  /tmp/adm3-recovery.sh" | sha256sum --check --strict
          python <<'PY'
          from pathlib import Path
          path = Path('/tmp/adm3-recovery.sh')
          text = path.read_text(encoding='utf-8').replace(
              'echo "UPGRADE_1_28_TO_53_54=PASS"',
              'echo "UPGRADE_1_28_TO_29_30=PASS"',
              1,
          )
          lines = text.splitlines()
          output = []
          in_python = False
          in_triple = False
          for line in lines:
              if line == "python <<'PY'":
                  in_python = True
                  output.append(line)
                  continue
              if in_python and line == 'PY':
                  in_python = False
                  output.append(line)
                  continue
              if in_python:
                  if in_triple and line.endswith('\\') and not line.endswith('\\\\'):
                      line += '\\'
                  if line.count("'''") % 2 == 1:
                      in_triple = not in_triple
              output.append(line)
          text = '\n'.join(output) + '\n'
          replacements = (
              ("'''             echo \"APPLY $validation\"", "'''            echo \"APPLY $validation\"", 2),
              ('             psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$validation" 2>&1 | tee -a "$log"\n           done\n', '            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$validation" 2>&1 | tee -a "$log"\n          done\n', 2),
              ('\n           if python verification/admin/adm3/run_baseline_data_verifiers.py --check-active; then\n', '\n          if python verification/admin/adm3/run_baseline_data_verifiers.py --check-active; then\n', 1),
              ('             for successor in \\\\\n', '            for successor in \\\\\n', 1),
              ('               database/journey-connect-db-v2.7/53_admin_control_plane_hardening.sql \\\\\n', '              database/journey-connect-db-v2.7/53_admin_control_plane_hardening.sql \\\\\n', 1),
              ('               database/journey-connect-db-v2.7/54_admin_control_plane_hardening_smoke_test.sql; do\n', '              database/journey-connect-db-v2.7/54_admin_control_plane_hardening_smoke_test.sql; do\n', 1),
              ('               echo "APPLY $successor" | tee -a "$log"\n', '              echo "APPLY $successor" | tee -a "$log"\n', 1),
              ('               psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$successor" 2>&1 | tee -a "$log"\n', '              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$successor" 2>&1 | tee -a "$log"\n', 1),
              ('             done\n           fi\n', '            done\n          fi\n', 1),
              ('    if tracked.startswith("verification/admin/adm3/fix/") or tracked.startswith(\n        "verification/admin/adm3/snapshot/"\n    ):\n        continue\n', '    if (\n        tracked == "verification/admin/adm3/verify_adm3.py"\n        or tracked.startswith("verification/admin/adm3/fix/")\n        or tracked.startswith("verification/admin/adm3/snapshot/")\n    ):\n        continue\n', 1),
          )
          for old, new, count in replacements:
              if text.count(old) < count:
                  raise SystemExit(f'missing deterministic recovery correction: {old[:80]!r}')
              text = text.replace(old, new, count)
          path.write_text(text, encoding='utf-8')
          PY
          echo "6c3a98764941f7d7ce9ac63f32914b7da9946c85742d3b413c5c897924083d01  /tmp/adm3-recovery.sh" | sha256sum --check --strict
          rm -rf verification/admin/adm3/recovery
          bash /tmp/adm3-recovery.sh > /tmp/adm3-recovery.log 2>&1
      - name: Upload ADM-3 recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adm3-recovery-diagnostics-${{ github.sha }}
          path: /tmp/adm3-recovery.log
          if-no-files-found: error
      - name: Enforce ADM-3 recovery
        if: steps.recovery.outcome == 'failure'
        run: exit 1
