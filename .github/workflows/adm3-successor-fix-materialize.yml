name: ADM-3 Successor Fix Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm3-successor-fix-materialize.yml"
      - "verification/admin/adm3/fix/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/adm3-admin-api-hardening-audit-acceptance' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply successor correction
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode verification/admin/adm3/fix/successor-renumber.patch.gz.b64 \
            | gzip --decompress > /tmp/adm3-successor.patch
          echo "c938814fe7b860a0203d36945ac9b47c239b1ac88e47f42e0881a6a8d5097e90  /tmp/adm3-successor.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/adm3-successor.patch
          git apply --index /tmp/adm3-successor.patch
          git rm -r verification/admin/adm3/fix
          git diff --cached --check
      - name: Commit and push successor correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admin): allocate unique forward migration sequence"
          git push origin HEAD:agent/adm3-admin-api-hardening-audit-acceptance
