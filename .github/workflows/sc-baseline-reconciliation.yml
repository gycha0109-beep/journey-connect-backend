name: SC Baseline Reconciliation

on:
  pull_request:
    paths:
      - "docs/platform/governance/**"
      - "docs/platform/data/**"
      - "docs/platform/proposals/**"
      - "verification/sc-dp1-baseline-reconciliation/**"
      - "verification/sc-next-track/**"
      - "verification/data-platform-closure/**"
      - ".github/workflows/sc-baseline-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate SC baseline through RCA-2 entry continuity
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification/sc-next-track/rca1b-entry/runtime
          python verification/sc-next-track/op3-entry/run_sc_baseline_reconciliation_continuity.py \
            2>&1 | tee verification/sc-next-track/rca1b-entry/runtime/SC_BASELINE_RECONCILIATION_CI.log
      - name: Validate Data Platform technical closure continuity
        shell: bash
        run: |
          set -o pipefail
          python verification/sc-next-track/op3-entry/run_data_platform_closure_continuity.py \
            2>&1 | tee verification/sc-next-track/rca1b-entry/runtime/DATA_PLATFORM_CLOSURE_CI.log
      - name: Upload SC continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-rca1b-entry-continuity-evidence
          retention-days: 90
          path: |
            verification/sc-next-track/rca1b-entry/runtime/**
            verification/sc-next-track/rca1-entry/runtime/**
            verification/sc-next-track/rca2-entry/runtime/**
            verification/sc-next-track/op3-entry/run_sc_baseline_reconciliation_continuity.py
            verification/sc-next-track/op3-entry/run_sc_rca2_entry_continuity.py
            verification/sc-next-track/op3-entry/run_data_platform_closure_continuity.py
          if-no-files-found: error
