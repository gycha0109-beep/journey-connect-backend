name: RCA-2 DP5 DP6 Static Continuity Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rca2-dp56-static-continuity-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply DP5 DP6 static continuity and verifier links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'verification/dp5/run_dp5_static_verification.py': (
                  '''    protected = [path for path in changed if path.startswith((
                  "jc-recommendation-core/", "jc-intelligence-contracts/", "jc-search-contracts/",
                  "jc-search-compatibility/", "jc-search-runtime/", "jc-search-integration/",
                  "jc-search-shadow-wiring/", "jc-search-readiness/", "jc-search-production-controls/",
                  "jc-backend/src/main/", "jc-backend/src/main/resources/",
              ))]
              if protected:
                  fail(f"protected production/Recommendation/Search source changed: {protected}")''',
                  '''    protected = [item for item in changed if item.startswith((
                  "jc-recommendation-core/", "jc-intelligence-contracts/", "jc-search-contracts/",
                  "jc-search-compatibility/", "jc-search-runtime/", "jc-search-integration/",
                  "jc-search-shadow-wiring/", "jc-search-production-controls/",
              ))]
              protected += [item for item in changed if item in (
                  "jc-backend/src/main/java/com/jc/backend/recommendation/p1/RecommendationP1ProfileSource.java",
                  "jc-backend/src/main/java/com/jc/backend/recommendation/p2/RecommendationP2ObservationSource.java",
              )]
              production_configs = [item for item in changed
                  if item.startswith("jc-backend/src/main/resources/application")
                  and item != "jc-backend/src/main/resources/application-rca2-isolated-nonproduction.yml"]
              if protected or production_configs:
                  fail(f"protected production/Recommendation/Search source changed: {protected + production_configs}")
              rca2_config = (ROOT / "jc-backend/src/main/resources/application-rca2-isolated-nonproduction.yml").read_text(encoding="utf-8")
              for marker in ("flag: off", "traffic-percent: 0", "max-production-dark-read-percent: 0",
                             "production-route-allowed: false", "db-change: NONE", "sql-allocation: NOT_REQUIRED"):
                  if marker not in rca2_config:
                      fail(f"RCA2 isolated config marker missing: {marker}")
              if "http://" in rca2_config or "https://" in rca2_config or "jdbc:" in rca2_config:
                  fail("RCA2 isolated config contains concrete route or DB connection")
              feed = (ROOT / "jc-backend/src/main/java/com/jc/backend/recommendation/application/RecommendationFeedService.java").read_text(encoding="utf-8")
              if "RCA-2 request registration failed open" not in feed or "return response;" not in feed:
                  fail("RCA2 primary response boundary missing")
              if "return registrar.registerFeed" in feed or "return rca2Registrar" in feed:
                  fail("RCA2 hook became response authority")'''
              ),
              'verification/dp6/run_dp6_static_verification.py': (
                  '''    protected=[path for path in changed if path.startswith((
                  "jc-recommendation-core/","jc-intelligence-contracts/","jc-search-contracts/","jc-search-compatibility/",
                  "jc-search-runtime/","jc-search-integration/","jc-search-shadow-wiring/","jc-search-readiness/",
                  "jc-search-production-controls/","jc-backend/src/main/","jc-backend/src/main/resources/"))]
              if protected: fail(f"protected production/Recommendation/Search source changed: {protected}")''',
                  '''    protected=[item for item in changed if item.startswith((
                  "jc-recommendation-core/","jc-intelligence-contracts/","jc-search-contracts/","jc-search-compatibility/",
                  "jc-search-runtime/","jc-search-integration/","jc-search-shadow-wiring/",
                  "jc-search-production-controls/"))]
              protected += [item for item in changed if item in (
                  "jc-backend/src/main/java/com/jc/backend/recommendation/p1/RecommendationP1ProfileSource.java",
                  "jc-backend/src/main/java/com/jc/backend/recommendation/p2/RecommendationP2ObservationSource.java",
              )]
              production_configs = [item for item in changed
                  if item.startswith("jc-backend/src/main/resources/application")
                  and item != "jc-backend/src/main/resources/application-rca2-isolated-nonproduction.yml"]
              if protected or production_configs:
                  fail(f"protected production/Recommendation/Search source changed: {protected + production_configs}")
              rca2_config=(ROOT/"jc-backend/src/main/resources/application-rca2-isolated-nonproduction.yml").read_text(encoding="utf-8")
              for marker in ("flag: off","traffic-percent: 0","max-production-dark-read-percent: 0",
                             "production-route-allowed: false","db-change: NONE","sql-allocation: NOT_REQUIRED"):
                  if marker not in rca2_config: fail(f"RCA2 isolated config marker missing: {marker}")
              if "http://" in rca2_config or "https://" in rca2_config or "jdbc:" in rca2_config:
                  fail("RCA2 isolated config contains concrete route or DB connection")
              runtime_source="\\n".join(item.read_text(encoding="utf-8")
                  for item in (ROOT/"jc-backend/src/main/java/com/jc/backend/recommendation/rca2").glob("*.java"))
              for token in ("JpaRepository","JdbcTemplate","EntityManager","ApplicationEventPublisher",
                            "KafkaTemplate","@Transactional","ForkJoinPool.commonPool","newCachedThreadPool",
                            "CallerRunsPolicy"):
                  if token in runtime_source: fail(f"RCA2 runtime violates DP6 static boundary: {token}")'''
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'static continuity target not found: {filename}')
              path.write_text(text.replace(old, new, 1))

          links = {
              'verification/data-platform-closure/run_data_platform_closure_verification.py': (
                  '''        "verification/dp6/run_dp6_allocation_verification.py",
                  "verification/dp7/run_dp7_allocation_verification.py",''',
                  '''        "verification/dp5/run_dp5_static_verification.py",
                  "verification/dp6/run_dp6_allocation_verification.py",
                  "verification/dp6/run_dp6_static_verification.py",
                  "verification/dp7/run_dp7_allocation_verification.py",'''
              ),
              'verification/sc-next-track/rca2-entry/run_sc_rca2_entry_verification.py': (
                  '''                "verification/dp6/run_dp6_allocation_verification.py",
                          "verification/dp7/run_dp7_allocation_verification.py",''',
                  '''                "verification/dp5/run_dp5_static_verification.py",
                          "verification/dp6/run_dp6_allocation_verification.py",
                          "verification/dp6/run_dp6_static_verification.py",
                          "verification/dp7/run_dp7_allocation_verification.py",'''
              ),
              'verification/rca1/run_rca1_verification.py': (
                  '''                "verification/dp6/run_dp6_allocation_verification.py",
                          "verification/dp7/run_dp7_allocation_verification.py",''',
                  '''                "verification/dp5/run_dp5_static_verification.py",
                          "verification/dp6/run_dp6_allocation_verification.py",
                          "verification/dp6/run_dp6_static_verification.py",
                          "verification/dp7/run_dp7_allocation_verification.py",'''
              ),
              'verification/rca1b/run_rca1b_verification.py': (
                  '''            "verification/dp6/run_dp6_allocation_verification.py",
                      "verification/dp7/run_dp7_allocation_verification.py",''',
                  '''            "verification/dp5/run_dp5_static_verification.py",
                      "verification/dp6/run_dp6_allocation_verification.py",
                      "verification/dp6/run_dp6_static_verification.py",
                      "verification/dp7/run_dp7_allocation_verification.py",'''
              ),
          }
          for filename, (old, new) in links.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'static continuity linkage not found: {filename}')
              path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/dp5/run_dp5_static_verification.py \
                  verification/dp6/run_dp6_static_verification.py \
                  verification/data-platform-closure/run_data_platform_closure_verification.py \
                  verification/sc-next-track/rca2-entry/run_sc_rca2_entry_verification.py \
                  verification/rca1/run_rca1_verification.py \
                  verification/rca1b/run_rca1b_verification.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(data): preserve DP5 DP6 static continuity across RCA2 phase'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
