name: ADM-3 Materialize Implementation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/adm3-materialize.yml"
      - "verification/admin/adm3/materialize/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adm3-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ADM-3 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/adm3-admin-api-hardening-audit-acceptance' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified ADM-3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat verification/admin/adm3/materialize/part-*.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/adm3.patch
          echo "89cd64353a18f543563e91b016a863f77d19b687543b2e2bd88896549a5f12a3  /tmp/adm3.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/adm3.patch
          git apply --index /tmp/adm3.patch

          # Workflow files are published through the GitHub connector after this commit.
          git reset HEAD -- .github/workflows/adm3-admin-hardening.yml
          rm -f .github/workflows/adm3-admin-hardening.yml

          git rm -r verification/admin/adm3/materialize
          git diff --cached --check
          git status --short
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(admin): harden audit concurrency and acceptance"
          git push origin HEAD:agent/adm3-admin-api-hardening-audit-acceptance
